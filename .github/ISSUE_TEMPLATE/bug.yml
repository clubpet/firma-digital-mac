name: Reportar un problema
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. **No pegues tu PIN, tu CUIL, el número de serie del token ni PDFs con datos reales.**
        Si es un problema de seguridad, no uses un issue: seguí [SECURITY.md](https://github.com/clubpet/firma-digital-mac/blob/main/SECURITY.md).
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué pasó en cambio. Capturas bienvenidas (tapando datos personales).
    validations:
      required: true
  - type: input
    id: version-app
    attributes:
      label: Versión de la app
      description: Firma Digital → Acerca de, o el nombre del DMG.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versión de macOS y Mac
      placeholder: "macOS 26.1, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: token
    attributes:
      label: Modelo de token
      placeholder: "mToken CryptoID FIPS 140-3 (Longmai / Macroseguridad)"
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Qué estabas usando
      options:
        - App nativa (DMG)
        - Modo web (python firma.py)
        - Compilado desde el código
    validations:
      required: true
  - type: dropdown
    id: validador
    attributes:
      label: ¿Qué dice el validador oficial?
      description: Si es un problema de firma o verificación, subí el PDF a https://validadordefirmas.gob.ar
      options:
        - No aplica
        - Dice que la firma es válida
        - Dice que la firma no es válida
        - No lo probé
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensajes o logs
      description: Texto de error que muestra la app, o la salida del motor si lo corriste desde Terminal.
      render: text
